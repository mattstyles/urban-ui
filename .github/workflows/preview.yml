name: Preview packages

# pkg.pr.new preview builds from every PR — the installable artifact that
# stands in for a real npm publish (ADR-0004: no other prerelease channel).
# Requires the pkg.pr.new GitHub App on this repository; until it is
# installed the publish step is allowed to fail without blocking the PR.
on: pull_request

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned deliberately: mise-action installs the latest release by
      # default, so CI tooling can change without a repo change. Bump on
      # purpose, not by drift.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build publishable packages
        # A single wildcard: `mise run a b` treats b as an argument to a.
        run: mise run '//...:build'

      - name: Publish previews to pkg.pr.new
        continue-on-error: true
        run: bunx pkg-pr-new publish ./packages/theme ./packages/react
